[package]
name = "nix-update-remote"
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
ed25519-dalek = { version = "2", default-features = false }
rustix = { version = "1.1.5", features = ["net", "process", "fs", "thread", "pipe", "event"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.3.18"
